<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mietpreis-Testtool</title>
<style>
  :root { --bg:#f5f5f3; --card:#fff; --text:#171717; --muted:#666; --line:#deded9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { width:min(920px,calc(100% - 32px)); margin:48px auto; }
  h1 { font-size:clamp(28px,5vw,46px); line-height:1.05; margin:0 0 10px; letter-spacing:-.03em; }
  .intro { margin:0 0 28px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  .inputs { display:grid; grid-template-columns:1fr 1fr auto; gap:14px; align-items:end; }
  label { display:block; font-size:13px; font-weight:700; margin-bottom:7px; }
  input { width:100%; height:48px; border:1px solid #bbb; border-radius:8px; padding:0 13px; font-size:18px; background:#fff; }
  input:focus { outline:2px solid #111; outline-offset:1px; }
  button { height:48px; padding:0 22px; border:0; border-radius:8px; background:#111; color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .status { margin-top:14px; color:var(--muted); font-size:13px; }
  .error { display:none; margin-top:18px; padding:12px 14px; border-radius:8px; background:#f3e8e8; color:#7a1f1f; }
  .results { display:none; margin-top:28px; }
  .result-head { font-size:14px; color:var(--muted); margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .result { padding:22px; min-height:150px; background:#fff; }
  .result + .result { border-left:1px solid var(--line); }
  .tag { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .rent { margin-top:12px; font-size:clamp(26px,4vw,38px); font-weight:800; letter-spacing:-.03em; }
  .unit { font-size:14px; color:var(--muted); margin-top:2px; }
  .sqm { margin-top:14px; font-size:14px; }
  .note { margin-top:18px; color:var(--muted); font-size:13px; line-height:1.45; }
  @media(max-width:700px) {
    .wrap { margin:24px auto; }
    .inputs,.grid { grid-template-columns:1fr; }
    .result + .result { border-left:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mietpreis-Testtool</h1>
  <p class="intro">Geschätzte Bruttomiete nach Postleitzahl und Wohnfläche.</p>
  <div class="card">
    <div class="inputs">
      <div>
        <label for="plz">Postleitzahl</label>
        <input id="plz" inputmode="numeric" maxlength="4" placeholder="z. B. 8001">
      </div>
      <div>
        <label for="area">Wohnfläche in m²</label>
        <input id="area" type="number" min="30" max="180" step="0.1" placeholder="z. B. 80">
      </div>
      <button id="calc" disabled>Berechnen</button>
    </div>

    <div id="status" class="status">Lade Modelldaten …</div>
    <div id="error" class="error"></div>

    <div id="results" class="results">
      <div id="resultHead" class="result-head"></div>
      <div class="grid">
        <div class="result"><div class="tag">Q20</div><div id="q20rent" class="rent"></div><div class="unit">CHF pro Monat</div><div id="q20sqm" class="sqm"></div></div>
        <div class="result"><div class="tag">Median</div><div id="q50rent" class="rent"></div><div class="unit">CHF pro Monat</div><div id="q50sqm" class="sqm"></div></div>
        <div class="result"><div class="tag">Q80</div><div id="q80rent" class="rent"></div><div class="unit">CHF pro Monat</div><div id="q80sqm" class="sqm"></div></div>
      </div>
      <div class="note">Q20, Median und Q80 werden aus den drei Modellparametern der jeweiligen PLZ berechnet. Modellbereich: 30–180 m².</div>
    </div>
  </div>
</div>

<script>
const JSON_FILE = "mietmodell_plz_parameter.json";
let MODEL = null;

const plzEl = document.getElementById("plz");
const areaEl = document.getElementById("area");
const calcEl = document.getElementById("calc");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const resultsEl = document.getElementById("results");

async function loadModel() {
  try {
    const response = await fetch(JSON_FILE, {cache:"no-store"});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    MODEL = await response.json();
    statusEl.textContent = `Modelldaten geladen: ${Object.keys(MODEL).length} PLZ`;
    calcEl.disabled = false;
  } catch (err) {
    statusEl.textContent = "";
    showError(
      `Die Datei "${JSON_FILE}" konnte nicht geladen werden. ` +
      `HTML und JSON müssen im gleichen Ordner über einen lokalen oder Web-Server bereitgestellt werden.`
    );
  }
}

function estimate(beta, area) {
  const x = Math.log(area);
  return beta[0] + beta[1] * x + beta[2] * x * x;
}
function chf(v) { return Math.round(v).toLocaleString("de-CH"); }
function oneDecimal(v) { return v.toLocaleString("de-CH",{minimumFractionDigits:1,maximumFractionDigits:1}); }

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = "block";
  resultsEl.style.display = "none";
}

function calculate() {
  errorEl.style.display = "none";
  if (!MODEL) return showError("Die Modelldaten sind noch nicht geladen.");

  const plz = plzEl.value.trim().padStart(4,"0");
  const area = Number(areaEl.value);

  if (!/^\d{4}$/.test(plz)) return showError("Bitte eine vierstellige PLZ eingeben.");
  if (!MODEL[plz]) return showError(`Für PLZ ${plz} sind keine Modellparameter vorhanden.`);
  if (!Number.isFinite(area) || area < 30 || area > 180) return showError("Bitte eine Wohnfläche zwischen 30 und 180 m² eingeben.");

  const p = MODEL[plz];
  const q20 = estimate(p.q20, area);
  const q50 = estimate(p.q50, area);
  const q80 = estimate(p.q80, area);

  document.getElementById("resultHead").textContent = `PLZ ${plz} · ${oneDecimal(area)} m²`;
  for (const [id, q] of [["q20",q20],["q50",q50],["q80",q80]]) {
    document.getElementById(id+"rent").textContent = chf(q * area / 12);
    document.getElementById(id+"sqm").textContent = `${chf(q)} CHF/m²/Jahr`;
  }
  resultsEl.style.display = "block";
}

calcEl.addEventListener("click", calculate);
plzEl.addEventListener("keydown", e => { if (e.key==="Enter") calculate(); });
areaEl.addEventListener("keydown", e => { if (e.key==="Enter") calculate(); });

loadModel();
</script>
</body>
</html>
